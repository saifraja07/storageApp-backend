
name: Deploy Backend to AWS Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy-lambda:
    name: Deploy to Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Check deployment package size
        run: |
          echo "Node modules size:"
          du -sh node_modules

          echo "Total application size:"
          du -sh .

      - name: Create Lambda deployment package
        run: |
          zip -qr lambda-deployment.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".env" \
            -x ".env.*" \
            -x "logs/*" \
            -x "*.log" \
            -x "README.md" \
            -x "lambda-deployment.zip"

          echo "ZIP size:"
          ls -lh lambda-deployment.zip

          echo "ZIP size in bytes:"
          stat -c%s lambda-deployment.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload deployment package to S3
        run: |
          aws s3 cp lambda-deployment.zip \
            "s3://${{ vars.LAMBDA_DEPLOYMENT_BUCKET }}/lambda-deployments/${GITHUB_SHA}.zip"

      - name: Deploy Lambda function from S3
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --s3-bucket "${{ vars.LAMBDA_DEPLOYMENT_BUCKET }}" \
            --s3-key "lambda-deployments/${GITHUB_SHA}.zip"

      - name: Wait for Lambda deployment
        run: |
          aws lambda wait function-updated \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

      - name: Verify Lambda deployment
        run: |
          aws lambda get-function-configuration \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --query '{FunctionName:FunctionName,State:State,LastUpdateStatus:LastUpdateStatus,Runtime:Runtime,Architectures:Architectures}'